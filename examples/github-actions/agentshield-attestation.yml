name: AgentShield Attestation

on:
  pull_request:

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AgentShield
        run: pip install terraguard-agentshield
      - name: Generate attestation when audit exists
        run: |
          mkdir -p .terraguard/artifacts
          if ls .terraguard/audit/session-*.json >/dev/null 2>&1; then
            SESSION_ID=$(ls -t .terraguard/audit/session-*.json | head -1 | sed 's/.*session-//;s/\.json//')
            terraguard-agentshield evidence validate \
              --session-id "$SESSION_ID" \
              --audit-dir .terraguard/audit \
              --fail-on block,require_approval \
              --output .terraguard/artifacts/agentshield-validation.json
            terraguard-agentshield agent attest "$SESSION_ID" \
              --audit-dir .terraguard/audit \
              --format markdown > .terraguard/artifacts/agentshield-report.md
            terraguard-agentshield report generate \
              --audit-dir .terraguard/audit \
              --bundle-dir .terraguard/agentshield/evidence \
              --validation .terraguard/artifacts/agentshield-validation.json \
              --output .terraguard/artifacts/agentshield-governance-report.md
          else
            echo "No AgentShield audit found"
            exit 1
          fi
      - name: Publish AgentShield PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SESSION_ID=$(ls -t .terraguard/audit/session-*.json | head -1 | sed 's/.*session-//;s/\.json//')
          terraguard-agentshield evidence publish-github-comment \
            --session-id "$SESSION_ID" \
            --audit-dir .terraguard/audit
          terraguard-agentshield report publish-github-comment \
            --audit-dir .terraguard/audit \
            --bundle-dir .terraguard/agentshield/evidence \
            --validation .terraguard/artifacts/agentshield-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentshield-attestation
          path: .terraguard/artifacts/
