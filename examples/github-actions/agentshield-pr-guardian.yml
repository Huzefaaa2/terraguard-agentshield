name: AgentShield PR Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  agentshield-pr-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgentShield
        run: |
          python -m pip install --upgrade pip
          pip install terraguard-agentshield

      - name: Generate pull request diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --unified=3 "origin/${{ github.base_ref }}...HEAD" > change.diff

      - name: Run AgentShield PR Guardian
        run: |
          terraguard-agentshield pr guard \
            --diff change.diff \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --policy-pack banking-regulated-ai \
            --fail-on high \
            --publish-comment \
            --output-dir .terraguard/agentshield/pr-guardian
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AgentShield evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-pr-guardian
          path: .terraguard/agentshield/pr-guardian
