services:
  agentshield-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/huzefaaa2/terraguard-agentshield:0.1.0
    environment:
      TERRAGUARD_AGENTSHIELD_DATA_DIR: /var/lib/agentshield
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - agentshield-data:/var/lib/agentshield
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      agentshield-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=8m,noexec,nosuid,nodev
      - /tmp:size=32m,noexec,nosuid,nodev
    volumes:
      - ./nginx/agentshield.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  agentshield-data:
