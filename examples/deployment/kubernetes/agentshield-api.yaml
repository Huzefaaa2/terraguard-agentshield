apiVersion: v1
kind: Namespace
metadata:
  name: agentshield
  labels:
    app.kubernetes.io/name: terraguard-agentshield
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentshield-api-config
  namespace: agentshield
data:
  TERRAGUARD_AGENTSHIELD_DATA_DIR: /var/lib/agentshield
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentshield-data
  namespace: agentshield
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentshield-api
  namespace: agentshield
  labels:
    app.kubernetes.io/name: terraguard-agentshield
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: terraguard-agentshield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraguard-agentshield
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/huzefaaa2/terraguard-agentshield:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentshield-api-config
          command:
            - terraguard-agentshield
          args:
            - api
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --data-dir
            - /var/lib/agentshield
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: agentshield-data
              mountPath: /var/lib/agentshield
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: agentshield-data
          persistentVolumeClaim:
            claimName: agentshield-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentshield-api
  namespace: agentshield
  labels:
    app.kubernetes.io/name: terraguard-agentshield
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: terraguard-agentshield
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentshield-api-ingress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: terraguard-agentshield
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agentshield-client: "true"
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
