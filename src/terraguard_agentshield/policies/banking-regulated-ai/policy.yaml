metadata:
  id: banking-regulated-ai
  title: Banking Regulated AI Governance
  description: Runtime governance policies for banking and financial services.
  version: 0.1.0
filesystem:
  block_read:
    - ".env"
    - "**/secrets.*"
    - "**/*.pem"
    - "**/kubeconfig"
    - "**/terraform.tfstate"
    - "**/terraform.tfvars"
  require_approval_write:
    - "**/iam/**"
    - "**/security/**"
    - "**/policies/**"
commands:
  block:
    - "terraform apply*"
    - "kubectl delete*"
    - "az role assignment create*"
    - "aws iam create-access-key*"
    - "gcloud projects add-iam-policy-binding*"
    - "git push origin main"
  require_approval:
    - "aws *"
    - "az *"
    - "gcloud *"
    - "kubectl apply*"
    - "curl *"
    - "wget *"
  allow:
    - "terraform fmt*"
    - "terraform validate*"
    - "terraform plan*"
    - "pytest*"
    - "npm test*"
git:
  require_pull_request: true
  block_direct_push_to_protected_branch: true
  protected_branches:
    - main
    - master
    - production
  require_human_reviewer: true
  require_ai_attestation: true
