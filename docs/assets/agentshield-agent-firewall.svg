<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">TerraGuard AgentShield agent firewall overview</title>
  <desc id="desc">AI coding agents send actions through AgentShield runtime policy before reaching files, shell, Git, MCP tools, cloud CLIs, and audit evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef5f0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="70" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">TerraGuard AgentShield</text>
  <text x="70" y="106" fill="#334155" font-family="Arial, sans-serif" font-size="18">Runtime governance for AI coding agents before code reaches Git</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="260" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="104" y="224" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">AI Coding Agents</text>
    <text x="104" y="262" fill="#334155" font-family="Arial, sans-serif" font-size="16">Claude Code</text>
    <text x="104" y="294" fill="#334155" font-family="Arial, sans-serif" font-size="16">Codex / Copilot</text>
    <text x="104" y="326" fill="#334155" font-family="Arial, sans-serif" font-size="16">Cursor / Duo</text>
    <text x="104" y="358" fill="#334155" font-family="Arial, sans-serif" font-size="16">MCP-enabled tools</text>
  </g>

  <path d="M350 300 H460" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <path d="M600 150 C670 185 730 190 800 150 V300 C800 388 716 456 600 506 C484 456 400 388 400 300 V150 C470 190 530 185 600 150Z" fill="url(#shield)"/>
    <text x="505" y="246" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">AgentShield</text>
    <text x="476" y="282" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17">Policy Decision Engine</text>
    <text x="470" y="329" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">allow / block / approval</text>
    <text x="498" y="363" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">immutable audit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="118" width="250" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="902" y="162" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Files + Secrets</text>
    <rect x="870" y="212" width="250" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="902" y="256" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Shell + Cloud CLI</text>
    <rect x="870" y="306" width="250" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="902" y="350" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Git + Pull Requests</text>
    <rect x="870" y="400" width="250" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="902" y="444" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">MCP + Tools</text>
  </g>

  <path d="M790 238 C828 208 835 162 870 153" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M808 282 H870" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M790 342 C828 354 835 348 870 341" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M766 404 C820 438 835 438 870 435" fill="none" stroke="#64748b" stroke-width="3"/>

  <rect x="400" y="532" width="400" height="48" rx="14" fill="#0f172a"/>
  <text x="445" y="563" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">JSON evidence + PR attestation + SIEM roadmap</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
