<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentShield C4 container diagram</title>
  <desc id="desc">C4 container view showing CLI and hook adapters, runtime policy engine, policy registry, audit recorder, policy packs, and external systems.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">C4 Container View</text>
  <text x="60" y="92" fill="#475569" font-family="Arial, sans-serif" font-size="18">TerraGuard AgentShield runtime governance architecture</text>

  <rect x="60" y="140" width="260" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="92" y="185" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI Coding Agent</text>
  <text x="92" y="216" fill="#475569" font-family="Arial, sans-serif" font-size="15">Claude Code, Codex, Copilot, Cursor, Duo</text>

  <rect x="430" y="128" width="320" height="145" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="468" y="176" fill="#164e63" font-family="Arial, sans-serif" font-size="21" font-weight="700">CLI + Hook Adapter</text>
  <text x="468" y="210" fill="#155e75" font-family="Arial, sans-serif" font-size="15">Normalizes agent actions into policy checks</text>
  <text x="468" y="236" fill="#155e75" font-family="Arial, sans-serif" font-size="15">Commands: start, exec, check-file, check-mcp, attest</text>

  <rect x="430" y="330" width="320" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="468" y="378" fill="#14532d" font-family="Arial, sans-serif" font-size="21" font-weight="700">RuntimeGuard</text>
  <text x="468" y="412" fill="#166534" font-family="Arial, sans-serif" font-size="15">File, command, Git, and MCP decisions</text>
  <text x="468" y="438" fill="#166534" font-family="Arial, sans-serif" font-size="15">Decision: allow / block / require approval</text>
  <text x="468" y="464" fill="#166534" font-family="Arial, sans-serif" font-size="15">Policy matching and risk classification</text>

  <rect x="850" y="128" width="270" height="145" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="888" y="176" fill="#7c2d12" font-family="Arial, sans-serif" font-size="21" font-weight="700">Policy Registry</text>
  <text x="888" y="210" fill="#9a3412" font-family="Arial, sans-serif" font-size="15">Built-in and custom YAML policy packs</text>
  <text x="888" y="236" fill="#9a3412" font-family="Arial, sans-serif" font-size="15">Baseline, banking, Terraform, MCP</text>

  <rect x="850" y="330" width="270" height="170" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="888" y="378" fill="#312e81" font-family="Arial, sans-serif" font-size="21" font-weight="700">Audit + Evidence</text>
  <text x="888" y="412" fill="#3730a3" font-family="Arial, sans-serif" font-size="15">Session JSON</text>
  <text x="888" y="438" fill="#3730a3" font-family="Arial, sans-serif" font-size="15">PR markdown attestation</text>
  <text x="888" y="464" fill="#3730a3" font-family="Arial, sans-serif" font-size="15">SIEM and GRC export roadmap</text>

  <rect x="60" y="548" width="1060" height="92" rx="12" fill="#0f172a"/>
  <text x="92" y="592" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Enterprise systems</text>
  <text x="92" y="622" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">GitHub / GitLab, SIEM, ServiceNow, Jira, identity providers, cloud platforms, MCP registries</text>

  <path d="M320 200 H430" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 273 V330" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 200 H850" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 415 H850" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M985 500 V548" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
