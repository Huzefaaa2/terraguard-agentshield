[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraguard-agentshield"
version = "0.1.0"
description = "AI agent runtime governance for regulated engineering."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Huzefa Husain" }]
license = "BUSL-1.1"
keywords = ["ai", "governance", "runtime", "policy", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115",
  "cryptography>=42.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.8",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.3",
]

[project.scripts]
terraguard-agentshield = "terraguard_agentshield.cli:main"

[project.urls]
"Bug Tracker" = "https://github.com/Huzefaaa2/terraguard-agentshield/issues"
"Documentation" = "https://github.com/Huzefaaa2/terraguard-agentshield/tree/main/docs"
"Source Code" = "https://github.com/Huzefaaa2/terraguard-agentshield"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
terraguard_agentshield = ["py.typed", "policies/*/policy.yaml"]
